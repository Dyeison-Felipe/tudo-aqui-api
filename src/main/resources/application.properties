spring.config.import=optional:file:.env[.properties]

spring.application.name=tudo-aqui

server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tudo_aqui_db}
spring.datasource.username=${DB_USER:appuser}
spring.datasource.password=${DB_PASSWORD:root}

# Configurações próprias da aplicação
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
server.servlet.context-path=/api

# Configurações recomendadas do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

